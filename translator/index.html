<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Translator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Voice Translator</h2>
        <div class="row">
            <select id="fromLang">
                <option value="en">English</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="hi">Hindi</option>
            </select>
            <select id="toLang">
                <option value="es" selected>Spanish</option>
                <option value="en">English</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="hi">Hindi</option>
            </select>
        </div>
        <textarea id="inputText" placeholder="Type or use voice command...."></textarea>
        <div class="buttons">
            <button id="micBtn">🎤 Speak</button>
            <button id="translateBtn">Translate</button>
        </div>
        <textarea id="outputText" placeholder="Translation will appear here..." readonly></textarea>
    </div>
    <script src="script.js"></script> 
</body>
</html>
