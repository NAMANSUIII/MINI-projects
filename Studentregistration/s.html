<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Student Registration</h1>
    <form>
        <label for="name">Name:</label>
        <input placeholder="Enter your name" id="name" name="name" required>
        <br><br>
        <label for="email">Email:</label>
        <input placeholder="Enter your email" id="email" name="email" required>
        <br><br>
        <label for="course">Course:</label>
        <input placeholder="Enter your course" id="course" name="course" required>
        <br><br>
        <label for="phone">Phone:</label>
        <input placeholder="Enter you phone number" id="phone" name="phone">
        <br><br>
        <input type="submit" value="Register">
        <input type="reset" value="Reset">
    </form>
</body>
</html>
